# All relative paths are resolved from this configuration file's directory.
data:
  root: ../../../octffa/group_data
  manifest: ../artifacts/manifest.json
  splits: ../artifacts/splits.json
  streams: [gray_inner]
  cohort_streams: [_vertical, _horizontal, color_full, color_inner, color_outer, gray_full, gray_inner, gray_outer]
  class_to_idx: {bad: 0, good: 1}
  require_all_streams: true
split:
  n_folds: 10
  val_fraction: 0.2
  seed: 42
preprocessing:
  image_size: 448
  resize_size: 448
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  crop_scale: [0.95, 1.0]
  crop_ratio: [0.95, 1.02]
  horizontal_flip_probability: 0.5
model:
  name: resnet50
  pretrained: true
  hidden_dim: 2048
  freeze_backbones: false
  initialization: {}
train:
  epochs: 50
  batch_size: 8
  num_workers: 0
  lr: 0.0007
  weight_decay: 0.01
  optimizer: adamw
  momentum: 0.9
  scheduler: cosine
  step_size: 7
  gamma: 0.1
  seed: 42
  device: auto
  amp: true
  patience: 10
  selection_metric: val_loss
experiment:
  name: single_gray_inner
  output_dir: ../runs/single_gray_inner
