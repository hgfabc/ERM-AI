# Explicit inference settings for the legacy eight-stream ResNet50.
# Verify stream semantics against the original training configuration before publishing.
# The saved 2025-09-23 environment used torchvision 0.16.2:
# old data.py resized tensors with antialias=None (False for tensors).
model:
  name: resnet50
  hidden_dim: 2048
  freeze_backbones: false
data:
  streams: [_vertical, _horizontal, color_full, color_inner, color_outer, gray_full, gray_inner, gray_outer]
  class_to_idx: {bad: 0, good: 1}
preprocessing:
  image_size: 448
  resize_size: 448
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  resize_backend: tensor
  interpolation: bilinear
  antialias: false
